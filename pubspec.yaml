name: pqthreshold
description: >-
  Pure-Dart threshold cryptography: verifiable secret sharing, distributed key
  generation and FROST threshold signatures, so no single party ever holds the
  full secret.
version: 1.1.0
repository: https://github.com/turkananation/pqthreshold
homepage: https://turkananation.github.io/pqthreshold/
documentation: https://github.com/turkananation/pqthreshold/wiki

environment:
  sdk: ^3.12.2

platforms:
  android:
  ios: 
  macos: 
  windows:
  linux: 

# pqforge: crypto (pqforge-first; pointycastle last resort).
# swissarmyknife: state machines, Result, validation, codecs — see doc/SWISSARMYKNIFE.md.
dependencies:
  args: ^2.7.0
  meta: ^1.16.0
  pqforge: ^0.4.5
  zeroize: ^0.1.0
  swissarmyknife: ^0.1.0

executables:
  pqthreshold: pqthreshold

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
