[package]
name = "mithril_bridge"
version = "0.1.0"
edition = "2021"
description = "JSON CLI bridge for threshold ML-DSA (Mithril) — pqthreshold M2/M3"

[[bin]]
name = "mithril_bridge"
path = "src/main.rs"

[dependencies]
threshold-ml-dsa = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
rand = "0.8"
base64 = "0.22"
sha3 = "0.10"
