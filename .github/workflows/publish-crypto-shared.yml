name: Publish crypto_shared to pub.dev

# crypto_shared is a SEPARATE published package that lives inside this
# repository, at packages/crypto_shared. It versions independently of
# pqthreshold itself and is published from its own tag.
#
# The root package's publish.yml deliberately does NOT cover it: `dart pub
# publish` run from the repository root would publish pqthreshold, and a tag
# like v1.1.0 is ambiguous between the two. This workflow removes the ambiguity
# by requiring an explicit `crypto_shared-v*` tag.
#
# So:
#   v1.1.0            -> pqthreshold   (publish.yml)
#   crypto_shared-v1.0.1 -> crypto_shared (this workflow)
#
# One-time setup on https://pub.dev/packages/crypto_shared/admin
# (Automated publishing → GitHub Actions):
#   repository:  turkananation/pqthreshold
#   tag-pattern: crypto_shared-v{{version}}
#   push events: enabled
#   workflow_dispatch: optional fallback (enabled below)
#   Require GitHub Actions environment: pub.dev
#
# Also create the matching GitHub Environment (Settings → Environments →
# New environment → name: pub.dev). It is shared with the root publish workflow.
#
# pub.dev only allows automated publishing after the package already exists.
# crypto_shared 1.0.0 is live, so this is satisfied. After that, do not also run
# `dart pub publish` by hand for a tagged release: this workflow is the
# publisher.
#
# Do not add a `release` event trigger: a GitHub Release that creates a new tag
# already fires this `push` event, and a second trigger would double-publish.

on:
  push:
    tags:
      - 'crypto_shared-v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag to publish (e.g. crypto_shared-v1.0.1)'
        required: true
        type: string

permissions:
  contents: read
  id-token: write # OIDC token for pub.dev; no long-lived pub credential

jobs:
  publish:
    name: Publish crypto_shared to pub.dev
    runs-on: ubuntu-latest
    environment: pub.dev
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: packages/crypto_shared
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Print Dart version
        run: dart --version

      - name: Install dependencies
        run: dart pub get

      - name: Assert tag matches pubspec version
        if: startsWith(github.ref, 'refs/tags/crypto_shared-v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          ver="${tag#crypto_shared-v}"
          pubspec_ver="$(python3 -c "import pathlib,re; t=pathlib.Path('pubspec.yaml').read_text(); print(re.search(r'^version:\s+(\S+)', t, re.M).group(1))")"
          test "$ver" = "$pubspec_ver"

      # Stage the package OUTSIDE the repository before publishing.
      #
      # `dart pub publish` collects .pubignore from the package directory AND its
      # ancestors. The repository root .pubignore ends with `packages/`, which is
      # correct when publishing pqthreshold from the root — it keeps the nested
      # package out of pqthreshold's archive. But it also means publishing
      # crypto_shared from inside the tree hides everything: the dry run reports
      # "The pubspec is hidden", the archive is <1 KB, and LICENSE, README and
      # CHANGELOG all go missing. `dart pub publish -C packages/crypto_shared`
      # does not help; the ancestor rules still apply.
      #
      # Exporting to $RUNNER_TEMP puts the package in a directory with no ancestor
      # .pubignore, so the archive contains exactly the package. This is also the
      # single mechanism for workflow_dispatch, which has no tag to check out.
      #
      # The archive is built from the index (`git ls-files`) rather than
      # `git archive <ref> <pathspec>`. On the runners' git (2.55), that form
      # fails inside the shallow checkout actions/checkout produces —
      # "pathspec did not match any files" even though packages/crypto_shared
      # exists and the steps above have just read it — while the index-based
      # archive works on every git version, shallow or not.
      - name: Stage package outside the repository
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # A dispatched run starts on the default branch. Fetch the
            # requested ref and check it out so the index and working
            # tree are the release tree.
            git fetch --depth=1 origin "${{ inputs.ref }}"
            git checkout --force FETCH_HEAD
          fi
          stage="${RUNNER_TEMP}/crypto_shared"
          rm -rf "$stage"
          mkdir -p "$stage"
          git ls-files -- packages/crypto_shared \
            | tar -cf - -T - \
            | tar -x -C "$stage" --strip-components=2
          echo "STAGE=$stage" >> "$GITHUB_ENV"
          echo "Staged to $stage:" >&2
          ls -la "$stage" >&2

      - name: Verify the staged package
        working-directory: ${{ env.STAGE }}
        run: |
          set -euo pipefail
          for f in pubspec.yaml LICENSE README.md CHANGELOG.md; do
            test -s "$f" || { echo "::error::$f missing or empty in staged package"; exit 1; }
          done
          dart pub get

      - name: Publish dry run
        working-directory: ${{ env.STAGE }}
        run: dart pub publish --dry-run

      - name: Publish to pub.dev
        working-directory: ${{ env.STAGE }}
        run: dart pub publish --force